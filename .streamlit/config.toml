[theme]
primaryColor = "#667eea"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#e8eaf6"
textColor = "#333333"
font = "sans serif"

[client]
showErrorDetails = true

[logger]
level = "info"

[server]
headless = true
port = 8501
runOnSave = true
enableRunOnSave = true

# Timeout settings for RAG initialization
[client]
showErrorDetails = true
toolbarMode = "viewer"

[browser]
serverAddress = "localhost"

# Configuration for production
[server]
maxUploadSize = 200
enableCORS = true
enableXsrfProtection = true
