name: Code Quality - Format & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check code formatting with Black
      run: |
        black --check --diff src/ app.py || true

    - name: Format Python code with Black (if needed)
      run: |
        black src/ app.py
        if [ -n "$(git diff)" ]; then
          echo "Code formatting changes detected"
          git diff
        fi

    - name: Create Pull Request for formatting (optional)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { exec } = require('child_process');
          exec('git diff --stat', (error, stdout) => {
            if (stdout) {
              console.log('Files that need formatting:\n' + stdout);
            }
          });

  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check Python syntax
      run: |
        python -m py_compile src/*.py app.py || true

    - name: Verify imports
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        try:
            from src import agent, advisory_ui, model_utils, rag_system, train, prompts
            print('✓ All imports successful')
        except ImportError as e:
            print(f'✗ Import error: {e}')
        "
